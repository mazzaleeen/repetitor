# Настройки сайта. Меняйте только текст в кавычках и сохраняйте (кнопка «Commit changes» на GitHub).
# Строки, начинающиеся с #, — подсказки, на сайт они не попадают.

[site]
name = "[Имя Фамилия]"                         # имя в шапке и подвале
role = "Репетитор по русскому языку"           # подпись под именем
badge = "Онлайн-занятия · 6–11 классы"         # надпись над заголовком на главной
title = "Русский язык для 6–11 классов"        # главный заголовок
text = "Подготовка к ОГЭ и ЕГЭ, школьная программа и грамотность. Материалы к занятиям собраны по классам — выберите свой."

[lessons]
format = "Онлайн по видеосвязи"                # формат занятий
format_note = "Из дома, без дороги"            # пояснение к формату
trial_price = "[цена или «бесплатно»]"         # цена пробного занятия (30 минут)
regular_price = "[цена] ₽"                     # цена обычного занятия (60 минут)

[contacts]
telegram = ""                                  # ник в Telegram без @, например "anna_russkiy"
phone = ""                                     # телефон, например "+7 900 123-45-67"
title = "Записаться на пробное занятие"        # заголовок тёмного блока с контактами
text = "Напишите или позвоните — подберём время и обсудим цели."

# Классы. Чтобы скрыть класс с сайта, поставьте show = false.
# exam — метка на карточке: "ОГЭ", "ЕГЭ" или "" (без метки).
# description — текст на карточке на главной, intro — текст вверху страницы класса.

