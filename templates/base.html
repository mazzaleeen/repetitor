{% import "_icons.html" as icons %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
{% block head %}{% endblock %}
  <title>{% block title %}{{ site.name }} — {{ site.role|lower }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.subheading }}{% endblock %}">
  <link rel="preload" href="{{ base }}/static/fonts/manrope-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ base }}/static/fonts/unbounded-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="{{ base }}/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{ base }}/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ base }}/static/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ base }}/static/css/site.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ base }}/">
      <span class="logo" aria-hidden="true">Аа</span>
      <span class="brand-text"><span class="brand-name">{{ site.name }}</span><span class="brand-role">{{ site.role }}</span></span>
    </a>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
