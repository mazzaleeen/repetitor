{% extends "base.html" %}
{% block content %}
<section id="classes" class="section wrap">
  <h1 class="section-title">{{ site.heading }}</h1>
  <p class="section-lead">{{ site.subheading }}</p>
  <div class="grades">
    {% for g in grades %}
      <a class="grade-card" href="{{ base }}/klass/{{ g.number }}/">
        <span class="grade-top"><span class="num">{{ g.number }}</span>{% if g.exam %}<span class="badge">{{ g.exam }}</span>{% endif %}</span>
        <span class="grade-label">класс</span>
        <span class="grade-desc">{{ g.description }}</span>
        <span class="more">Материалы {{ icons.arrow(16) }}</span>
      </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
